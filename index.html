      (function() {
        try {
          let currentFetch = window.fetch;
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'fetch' && descriptor) {
              const origGet = descriptor.get;
              const origSet = descriptor.set;
              currentFetch = descriptor.get ? descriptor.get() : (descriptor.value || currentFetch);
              return origDefineProperty.call(Object, obj, prop, {
                configurable: true,
                enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
                get: function() {
                  if (origGet) return origGet.call(this);
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                  if (origSet) origSet.call(this, val);
                },
              });
            }
            return origDefineProperty.apply(this, arguments);
          };

          const isFetchGetterError = function(msg) {
            return typeof msg === 'string' && msg.includes('fetch') && msg.includes('getter');
          };

          window.addEventListener('error', function(event) {
            if (event && isFetchGetterError(event.message)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          const origOnError = window.onerror;
          window.onerror = function(message, source, lineno, colno, error) {
            if (isFetchGetterError(message)) {
              return true;
            }
            if (origOnError) {
              return origOnError.apply(this, arguments);
            }
          };
        } catch (e) {
          // Ignore
        }
      })();
