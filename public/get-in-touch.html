    --hl-lh: 1; --hl-wght: 578;

    --eph-fs: 15.68px; --eph-ls: -0.188px; --eph-left: 17.0px; --eph-fw: 400; --eph-ws: 0px;

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    background: var(--page);
  }

  body {
    font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .photo {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 57.1038%;
    overflow: hidden;
  }

  .photo-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 100% 50%;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  .photo-img--tall {
    display: block;
  }

  .photo-img--wide {
    display: none;
  }

  .scrim {
    display: none;
  }

  .hero {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 836px;
    height: 949px;
    transform-origin: left bottom;
    pointer-events: none;
  }

  .hero > * {
    pointer-events: auto;
  }

  .badge {
    position: absolute;
    left: var(--badge-left);
    top: var(--badge-top);
    display: inline-flex;
    align-items: center;
    height: 37px;
    padding: 0 16px 0 19px;
    border-radius: 999px;
    background: var(--badge-bg);
    backdrop-filter: blur(7px) saturate(120%);
    -webkit-backdrop-filter: blur(7px) saturate(120%);
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
    color: #fff;
    white-space: nowrap;
    font-size: var(--badge-fs);
    font-weight: var(--badge-fw);
    letter-spacing: var(--badge-ls);
    word-spacing: var(--badge-ws);
    gap: var(--badge-gap);
  }

  .badge svg {
    width: 17px;
    height: 16.27px;
    position: relative;
    top: -1px;
    flex-shrink: 0;
  }

  .hl-wrap {
    position: static;
  }

  .hl {
    position: absolute;
    font-family: 'Eloquia', sans-serif;
    font-variation-settings: 'wght' var(--hl-wght);
    line-height: var(--hl-lh);
    color: var(--ink);
    white-space: nowrap;
  }

  #hl1 {
    left: var(--hl1-left);
    top: var(--hl1-top);
    font-size: var(--hl1-fs);
    letter-spacing: var(--hl1-ls);
    word-spacing: var(--hl1-ws);
  }

  #hl2 {
    left: var(--hl2-left);
    top: var(--hl2-top);
    font-size: var(--hl2-fs);
    letter-spacing: var(--hl2-ls);
  }

  .pane {
    position: absolute;
    left: 57.1038%;
    right: 0;
    top: 0;
    bottom: 0;
  }

  .card {
    position: absolute;
    left: 1px;
    top: 14px;
    width: 613px;
    height: 922px;
    border-radius: 26px;
    overflow: hidden;
    background: rgba(254, 254, 254, 0.90);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid rgba(0, 0, 0, 0.036);
    box-shadow: var(--card-shadow);
  }

  .card-in {
    position: relative;
    width: 613px;
    height: 922px;
    transform-origin: left top;
  }

  .col {
    position: absolute;
    left: 62px;
    width: 488px;
  }

  .col.center {
    text-align: center;
  }

  #h1 {
    top: var(--h1-top);
    font-family: 'Eloquia', sans-serif;
    font-variation-settings: 'wght' var(--h1-wght);
    font-size: var(--h1-fs);
    letter-spacing: var(--h1-ls);
    word-spacing: var(--h1-ws);
    color: var(--h1-color);
    line-height: 1.1;
    margin: 0;
  }

  #sub {
    top: var(--sub-top);
    font-size: var(--sub-fs);
    letter-spacing: var(--sub-ls);
    word-spacing: var(--sub-ws);
    font-weight: var(--sub-fw);
    color: var(--sub-grey);
    margin: 0;
  }

  #sub b {
    font-weight: var(--sub-fwb);
    color: var(--sub-grey);
  }

  .field {
    position: absolute;
    left: 62px;
    width: 489px;
    display: flex;
    align-items: center;
    border-radius: 12px;
    box-sizing: border-box;
  }

  .field input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    box-sizing: border-box;
  }

  #email {
    top: 203px;
    height: 61px;
    background: var(--inputFill);
    border: 1.5px solid var(--inputBorder);
    padding: 0 var(--fieldpad);
  }

  #email input {
    font-size: var(--eph-fs);
    letter-spacing: var(--eph-ls);
    word-spacing: var(--eph-ws);
    font-weight: var(--eph-fw);
    color: var(--ink);
  }

  #email input::placeholder {
    color: var(--ph);
  }

  #pw {
    top: 273.5px;
    height: 59px;
    background: var(--pwFill);
    border: 0;
    padding: 0 var(--fieldpad);
  }

  #pw input {
    font-size: var(--pph-fs);
    letter-spacing: var(--pph-ls);
    font-weight: var(--pph-fw);
    color: var(--ink);
  }

  #pw input::placeholder {
    color: var(--ph);
  }

  #loginBtn {
    position: absolute;
    left: 62px;
    top: 366px;
    width: 489px;
    height: 65.5px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--login-gap);
    padding-left: var(--login-padl);
    padding-right: 4px;
    box-shadow: 0 8px 20px rgba(18, 26, 34, 0.16), 0 2px 5px rgba(18, 26, 34, 0.10);
    cursor: pointer;
    font-family: inherit;
    font-size: var(--login-fs);
    font-weight: var(--login-fw);
    letter-spacing: var(--login-ls);
    transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.18s ease, filter 0.18s ease;
  }

  #loginBtn:hover {

      }
      if (vw >= RAMP_LO2) {
        var t2 = (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2);
        return PHOTO_MIN2 + t2 * (PHOTO_MIN - PHOTO_MIN2);
      }
      return PHOTO_MIN2;
    }

    function placeCard(paneW, vh) {
      var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
      var gapL = 1 * cs;
      var mT = 14 * cs;
      var mB = 13 * cs;
      var mR = 14 * cs;
      var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
      var ch = vh - mT - mB;
      card.style.left = gapL + 'px';
      card.style.top = mT + 'px';
      card.style.width = cw + 'px';
      card.style.height = ch + 'px';
      card.style.borderRadius = (26 * cs) + 'px';
      card.style.borderWidth = Math.max(1, cs) + 'px';
      cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';
    }

    function seatHero(photoW, vh) {
      var imgScale = Math.max(photoW / IMG_W, vh / IMG_H);
      var s = Math.min(imgScale / IMG_REF_SCALE, photoW * 0.92 / HERO_W);
      hero.style.transformOrigin = 'left bottom';
      hero.style.bottom = '0px';
      hero.style.transform = 'scale(' + s + ')';
    }

    function headlineMeasure() {
      var span = document.createElement('span');
      span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Eloquia,sans-serif;font-variation-settings:'wght' 578;font-size:69.14px;letter-spacing:-1.936px;';
      span.textContent = 'Find Signal to Action Instantly';
      document.body.appendChild(span);
      var w = span.offsetWidth;
      document.body.removeChild(span);
      return w || 780;
    }

    function layout() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      if (vw < 700) {
        setMode('phone');
        return;
      }

      if (mqPortrait.matches) {
        setMode('tabport');
        var band = Math.round(vh * 0.425);
        var sideMargin = Math.round(vw * 0.0525);
        var footerMargin = Math.round(vh * 0.0297);

        document.documentElement.style.setProperty('--band-h', band + 'px');
        document.documentElement.style.setProperty('--tp-side-margin', sideMargin + 'px');
        document.documentElement.style.setProperty('--tp-footer-margin', footerMargin + 'px');

        var cardW = vw - 2 * sideMargin;
        var cardH = vh - band - footerMargin;
        var S = Math.min(cardH, cardW * REF_CARD_ASPECT);

        document.documentElement.style.setProperty('--badge-k', (band * 0.0742 / 37).toFixed(4));
        document.documentElement.style.setProperty('--tp-hero-side', Math.round(vw * TP.heroSide) + 'px');
        document.documentElement.style.setProperty('--tp-hero-bot', Math.round(band * TP.heroBot) + 'px');
        document.documentElement.style.setProperty('--tp-hero-gap', Math.round(band * TP.heroGap) + 'px');
        document.documentElement.style.setProperty('--tp-hero-fs', Math.round(band * TP.heroFs) + 'px');
        document.documentElement.style.setProperty('--tp-hero-lh', TP.heroLh);

        var hlW = Math.round(headlineMeasure() * 0.61);
        document.documentElement.style.setProperty('--hl-measure', hlW + 'px');

        document.documentElement.style.setProperty('--tp-pad', Math.round(cardW * TP.pad) + 'px');
        document.documentElement.style.setProperty('--tp-or-pad', Math.round(cardW * TP.orPad) + 'px');
        document.documentElement.style.setProperty('--tp-h1-top', Math.round(cardH * TP.h1Top) + 'px');
        document.documentElement.style.setProperty('--tp-sub-top', Math.round(cardH * TP.subTop) + 'px');
        document.documentElement.style.setProperty('--tp-em-top', Math.round(cardH * TP.emTop) + 'px');
        document.documentElement.style.setProperty('--tp-em-h', Math.round(cardH * TP.emH) + 'px');
        document.documentElement.style.setProperty('--tp-em-r', Math.round(S * TP.emR) + 'px');
        document.documentElement.style.setProperty('--tp-pw-top', Math.round(cardH * TP.pwTop) + 'px');
        document.documentElement.style.setProperty('--tp-pw-h', Math.round(cardH * TP.pwH) + 'px');
        document.documentElement.style.setProperty('--tp-btn-top', Math.round(cardH * TP.btnTop) + 'px');
        document.documentElement.style.setProperty('--tp-btn-h', Math.round(cardH * TP.btnH) + 'px');
        document.documentElement.style.setProperty('--tp-div-top', Math.round(cardH * TP.divTop) + 'px');
        document.documentElement.style.setProperty('--tp-div-h', Math.max(1, Math.round(cardH * TP.divH)) + 'px');
        document.documentElement.style.setProperty('--tp-g-top', Math.round(cardH * TP.gTop) + 'px');
        document.documentElement.style.setProperty('--tp-g-h', Math.round(cardH * TP.gH) + 'px');
        document.documentElement.style.setProperty('--tp-bt-top', Math.round(cardH * TP.btTop) + 'px');

        document.documentElement.style.setProperty('--tp-h1-fs', Math.round(S * TP.h1Fs) + 'px');
        document.documentElement.style.setProperty('--tp-sub-fs', Math.round(S * TP.subFs) + 'px');
        document.documentElement.style.setProperty('--tp-eph-fs', Math.round(S * TP.ephFs) + 'px');
        document.documentElement.style.setProperty('--tp-eph-pad', Math.round(S * TP.ephPad) + 'px');
        document.documentElement.style.setProperty('--tp-pph-fs', Math.round(S * TP.ephFs * 1.1) + 'px');
        document.documentElement.style.setProperty('--tp-btn-fs', Math.round(S * TP.btnFs) + 'px');
        document.documentElement.style.setProperty('--tp-btn-gap', Math.round(S * TP.btnGap) + 'px');
        document.documentElement.style.setProperty('--tp-arrow', Math.round(S * TP.arrow) + 'px');
        document.documentElement.style.setProperty('--tp-or-fs', Math.round(S * TP.orFs) + 'px');
        document.documentElement.style.setProperty('--tp-g-icon', Math.round(S * TP.gIcon) + 'px');
        document.documentElement.style.setProperty('--tp-g-gap', Math.round(S * TP.gGap) + 'px');
        document.documentElement.style.setProperty('--tp-gt-fs', Math.round(S * TP.gtFs) + 'px');
        document.documentElement.style.setProperty('--tp-bt-fs', Math.round(S * TP.btFs) + 'px');
        return;
      }

      setMode('land');
      var pr = photoRatio(vw);
      var photoW = Math.round(vw * pr);
      var paneW = vw - photoW;

      photo.style.width = photoW + 'px';
      pane.style.left = photoW + 'px';

      placeCard(paneW, vh);
      seatHero(photoW, vh);
    }

    window.addEventListener('resize', layout, { passive: true });
    window.addEventListener('orientationchange', layout, { passive: true });
    if (mqLandscape.addEventListener) {
      mqLandscape.addEventListener('change', layout);
      mqPortrait.addEventListener('change', layout);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(layout);
    }
    layout();
  })();

  /* Entrance timeline */
  (function() {
    function releaseEntrance() {
      document.documentElement.classList.remove('entry-pending');
      if (window.__entryFallback) {
        clearTimeout(window.__entryFallback);
        window.__entryFallback = null;
      }
    }

    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced || !Element.prototype.animate) {
      releaseEntrance();
      return;
    }

    var ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
    var softEase = 'cubic-bezier(0.22, 1, 0.36, 1)';
    var compact = window.matchMedia('(max-width: 699px)').matches;

    var targets = [
      {
        sel: '.card',
        delay: 40,
        duration: 820,
        easing: ease,
        from: {
          opacity: 0,
          transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(0.988)'
        },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '.badge',
        delay: 120,
        duration: 480,
        easing: softEase,
        from: { opacity: 0, transform: 'translateY(8px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#hl1',
        delay: 240,
        duration: 760,
        easing: ease,
        from: {
          opacity: 0,
          transform: compact ? 'translateY(12px)' : 'translateY(16px)',
          clipPath: 'inset(100% 0 0 0)'
        },
        to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
      },
      {
        sel: '#hl2',
        delay: 330,
        duration: 760,
        easing: ease,
        from: {
          opacity: 0,
          transform: compact ? 'translateY(12px)' : 'translateY(16px)',
          clipPath: 'inset(100% 0 0 0)'
        },
        to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
      },
      {
        sel: '#h1',
        delay: 470,
        duration: 620,
        easing: ease,
        from: { opacity: 0, transform: 'translateY(10px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#sub',
        delay: 570,
        duration: 560,
        easing: ease,
        from: { opacity: 0, transform: 'translateY(10px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#email',
        delay: 720,
        duration: 520,
        easing: softEase,
        from: { opacity: 0, transform: 'translateY(8px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#pw',
        delay: 790,
        duration: 520,
        easing: softEase,
        from: { opacity: 0, transform: 'translateY(8px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#loginBtn',
        delay: 930,
        duration: 560,
        easing: ease,
        from: { opacity: 0, transform: 'translateY(8px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '.divider',
        delay: 1060,
        duration: 440,
        easing: softEase,
        from: { opacity: 0, transform: 'translateY(6px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#gBtn',
        delay: 1150,
        duration: 540,
        easing: ease,
        from: { opacity: 0, transform: 'translateY(8px)' },
        to: { opacity: 1, transform: 'none' }
      },
      {
        sel: '#bottom',
        delay: 1260,
        duration: 500,
        easing: softEase,
        from: { opacity: 0, transform: 'translateY(6px)' },
        to: { opacity: 1, transform: 'none' }
      }
    ];

    function startAnimations() {
      var animations = [];
      targets.forEach(function(item) {
        var el = document.querySelector(item.sel);
        if (!el) return;
        var anim = el.animate([item.from, item.to], {
          delay: item.delay,
          duration: item.duration,
          easing: item.easing,
          fill: 'both'
        });
        animations.push(anim);
      });

      releaseEntrance();

      Promise.allSettled(animations.map(function(a) { return a.finished; })).then(function() {
        animations.forEach(function(a) { a.cancel(); });
        animations.length = 0;
      });
    }

    var fontPromise = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    var timeoutPromise = new Promise(function(resolve) { setTimeout(resolve, 650); });

    Promise.race([fontPromise, timeoutPromise]).then(function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(startAnimations);
      });
    });
  })();
  </script>
